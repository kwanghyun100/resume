<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>이어하기</title>
  <meta name="description" content="출근 1분 만에 어제 작업으로 복귀하는 개인 웹 도구. 멈출 때 한 줄, 돌아올 때 카드 한 장.">
  <meta property="og:title" content="이어하기 — 어제 멈춘 곳에서 1분 안에 다시 시작">

  <meta name="theme-color" content="#2f6bff">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/style.css">
  <script>
    // 테마 깜빡임 방지: 저장된 테마를 먼저 적용
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><div class="boot">불러오는 중…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>

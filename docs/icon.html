<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* 앱 아이콘 생성용 (마스커블: 가장자리까지 배경을 채우고 로고는 안쪽 영역에) — 배포되지 않음
     사용: icon.html?s=192 → 왼쪽 위 192x192 영역을 캡처 */
  html, body { margin: 0; background: #111113; overflow: hidden; }
  .box { position: absolute; left: 0; top: 0; display: grid; place-items: center; background: #111113; }
</style></head><body>
<div class="box"><svg viewBox="12 12 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b8cff"/><stop offset="1" stop-color="#5b5bd6"/></linearGradient></defs><rect x="17" y="19" width="6" height="26" rx="3" fill="#ededef" opacity=".35"/><path d="M29 21.5v21a2 2 0 0 0 3 1.7l17-10.5a2 2 0 0 0 0-3.4L32 19.8a2 2 0 0 0-3 1.7z" fill="url(#g)"/></svg></div>
<script>
  const s = Number(new URLSearchParams(location.search).get("s")) || 512;
  const box = document.querySelector(".box"), svg = document.querySelector("svg");
  box.style.width = box.style.height = s + "px";
  svg.style.width = svg.style.height = Math.round(s * 0.62) + "px";
</script>
</body></html>
